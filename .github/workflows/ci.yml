name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: craci
    steps:
      - uses: cracicorp/setup@v1
        with:
          size: "2"
          image: default

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r backend/requirements.txt streamlit

      - name: Compile Python source
        run: .venv/bin/python -m compileall -q backend frontend
